# GROWTH RATE vs T AT THE 1125 K PHASE 2 FIT (MCTS rerun, node 3: 1.1696 um/min = 1.0026 x Lin at 1125 K,
# mean of 240 films).
# Read by run_kmc.py (run_default.sh shards it). Same seeds as the catalog curve: common random numbers.
#
# THE GROWTH RATE: the mean film height's rate through 50-200 A; a trajectory stops at the
# first checkpoint at or above 200 A (well below the 231.8 A lattice top). A film that stops
# growing ends by the stall rule and has NO rate at that temperature, reported as such.

[run]
temperatures = [900, 925, 950, 975, 1000, 1025, 1050, 1075, 1100,
                1125, 1150, 1175, 1200, 1225, 1230]
output_csv   = "results/default.csv"       # run_default.sh sets one per shard

[kmc]
lattice_file             = "Lattice_10nm_h232.xyz"   # the job passes the codebase's copy: --lattice $KMC_CODE/kmc/lattice/...
gr_window_A              = [50.0, 200.0]
stall_idle_factor        = 2.0
stall_min_events         = 500000
stall_rel_tol            = 0.005
stall_abs_tol_A          = 0.01
max_iterations           = 10000000       # backstop
reward_checkpoint_events = 20000
n_replicates             = 240
seed_base                = 95100000
n_workers                = 48

[params]   # all 54 at the 1125 K Phase 2 fit (fitted_1125K_phase2.json = MCTS1125_v2 best_params_b3_Cauto.json)
