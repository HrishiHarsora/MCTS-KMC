# =============================================================================
# config.toml -- generated by build_search.py. Nothing here is typed in;
# every number comes from search.json or from the DRC.
#
# LT+1125K: fit Lin 1977 at 900, 925, 950, 975, 1000 and 1125 K, every temperature within 10 %, from the 1125 K fit (MCTS rerun, node 3: 1.59 / 1.27 / 1.09 / 1.06 / 1.07 / 1.00 x Lin). 1125 K is protected by being one of the six targets (the stop rule needs it inside 10 % too); no parameter is leashed. Levers from the LT+1125K DRC about that root: S0_M_step and S0_M_terrace (the two strongest), Ea_chem_M (the MMGa chemisorption barrier: both MMGa sticking coefficients through exp(-Ea/T), so it tilts the curve; drc_table.csv row stick_M), Ea_E32 (R10, acts only at 1125 K) and Ea_E37 (R18, acts only at LT).
#
# Root    root_fit_1125K.json  md5 7fa2d366c3b4c0d5d221648a50133e0e
# Levers  drc_table.csv, 5 of 21 directions
#           stick_M_step -> S0_M_step     |D| 0.540..0.738  |Dh| 0.003..0.005  best SNR 503
#           stick_M_terr -> S0_M_terrace  |D| 0.302..0.411  |Dh| 0.001..0.003  best SNR 402
#           stick_M      -> Ea_chem_M     |D| 0.951..1.137  |Dh| 0.005..0.007  best SNR 581
#           E32          -> Ea_E32        |D| 0.002..0.426  |Dh| 0.000..0.002  best SNR 272
#           E37          -> Ea_E37        |D| 0.002..0.085  |Dh| 0.001..0.002  best SNR 77
#
# ERROR. Over every temperature at once:
#   L = sqrt( mean_T [ ln(GR_T/GR_exp_T)^2 + max(0, ln(h_min/h_T))^2 ] )
# The search stops only when EVERY temperature is inside error_threshold on
# the rate and EVERY film is above h_min_A; best_params holds the best node
# that is.
# =============================================================================

[run]
mode         = "ladder"
temperatures = [900, 925, 950, 975, 1000, 1125]

[target_curve]
900   = 0.53000
925   = 0.70000
950   = 0.87000
975   = 0.95000
1000  = 1.00376
1125  = 1.16653

[kmc]
lattice_file             = "Lattice_10nm_h232.xyz"

# THE GROWTH RATE: the mean height's rate through [lo, hi] A; a trajectory
# stops at the first checkpoint at or above hi (kmc/reward_metric.py).
gr_window_A              = [50.0, 200.0]
# STALL: end a film whose mean height has stopped advancing.
#   advance <=> h_mean > best + max(rel_tol*|best|, abs_tol)
#   stop    <=> idle >= max(min_events, idle_factor x events at last advance)
target_growth_angstrom   = 1000000.0
stall_idle_factor        = 2.0
stall_min_events         = 500000
stall_rel_tol            = 0.005
stall_abs_tol_A          = 0.01

# The backstop, not the intended stop: at most 10000000 / 20000 = 500 checkpoints.
max_iterations           = 10000000
reward_checkpoint_events = 20000

pressure_AsH  = 608      # NOT read: KMC.py hardcodes PA, PM = 608, 65.86
pressure_MMGa = 65.86

# --- replicates: every node measured to n_rep_total at EACH temperature,
# then extended a wave at a time while any temperature's running mean has
# not gone flat (kmc/flat_region.py: inside mean +- 1 SEM and at the middle of
# that band, before the last 20 % of the replicates), or its SEM is above
# sem_target_pct, up to n_rep_max. The rate is the mean of ALL replicates.
n_rep_total      = 160
n_rep_max        = 320
n_rep_wave       = 160
sem_target_pct   = 1.0
n_workers        = 48
seed_base        = 71250000

[objective]
# Every film must end above this at EVERY temperature for a node to be a
# result. At the window top it means every film grew through the whole window.
h_min_A = 200.0

[mcts]
C_ucb           = "auto"
tau             = "auto"
# 'auto': C = spread of the DRC's predicted rewards / sqrt(ln max_experiments),
# tau = L_root / 3. Both are read off the root, so neither is a free knob.
error_threshold = 0.0953        # e-folds, per temperature, on the RATE
max_experiments = 60
max_depth       = 20
max_children    = 5
expand_bias     = 0.7         # rate-only path only
# A child = u x (the smallest step vector that closes every temperature's
# rate gap and lifts any film back to the floor, least squares) + a random
# kick sized so the child is never predicted worse than its parent.
max_step_efolds = 1.0
step_ref_T      = 1125         # a barrier step s means s * this many kelvin
planner_map     = "learned"
additive_levers = ["Ea_chem_M", "Ea_E32", "Ea_E37"]

history_file     = "mcts_history.txt"
convergence_csv  = "mcts_convergence.csv"
best_params_json = "best_params.json"

# -----------------------------------------------------------------------------
# [search_params] name = [initial, low, high]. Initial = the root's value.
# -----------------------------------------------------------------------------
