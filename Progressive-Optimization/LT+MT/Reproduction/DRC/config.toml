# LT+MT DRC about the LT+1125K fit (MCTS node 35). Read by run_kmc.py; run_drc.sh passes each
# arm's parameter file (drc_params/, all 54 values), the temperature and its seed base from drc_tasklist.txt,
# and --nrep 144.
#
# THE GROWTH RATE: the mean film height's rate through 50-200 A; a trajectory stops at the first
# checkpoint at or above 200 A. A film that stops growing ends by the stall rule and has no rate.
# At 900-1125 K the fit grows every film through the window (MCTS node 35, 160 films each). At 1150 K it
# has not been measured: the baseline elements (0-10) come first and measure it.

[run]
temperatures = [900, 925, 950, 975, 1000, 1025, 1050, 1075, 1100, 1125, 1150]
output_csv   = "results/drc.csv"           # run_drc.sh sets one per element

[kmc]
lattice_file             = "Lattice_10nm_h232.xyz"   # the job passes the codebase's copy: --lattice $KMC_CODE/kmc/lattice/...
gr_window_A              = [50.0, 200.0]
stall_idle_factor        = 2.0
stall_min_events         = 500000
stall_rel_tol            = 0.005
stall_abs_tol_A          = 0.01
max_iterations           = 10000000
reward_checkpoint_events = 20000
n_replicates             = 144              # fixed: every arm pairs with the baseline replicate by replicate
seed_base                = 81250000         # drc_tasklist.txt passes each temperature its own base (CRN across arms)
n_workers                = 48
